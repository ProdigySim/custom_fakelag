name: build

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '30 03 01 */3 *' # Artifacts expire every 3 months

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-20.04
          os_short: oldlinux
          sourcemod_version: 1.10-dev
          branch: l4d2-fork
          sdk: l4d2
          cc: clang
          cxx: clang++

        - os: ubuntu-latest
          os_short: linux
          sourcemod_version: 1.12-dev
          branch: l4d2-fork
          sdk: l4d2
          cc: clang
          cxx: clang++

        - os: windows-latest
          os_short: windows
          sourcemod_version: 1.10-dev
          branch: l4d2-fork
          sdk: l4d2
          cc: ""
          cxx: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          
      - name: checkout repo
        uses: actions/checkout@v2
        with:
          path: 'src'
        
      - name: download ${{ matrix.sdk }} sdk
        uses: actions/checkout@v2
        with:
          repository: jensewe/hl2sdk
          ref: ${{ matrix.branch }}
          path: hl2sdk-${{ matrix.sdk }}
        
      - name: download sourcemod
        uses: actions/checkout@v2
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sourcemod_version }}
          path: 'sourcemod'
        
      - name: download sourcemod submodules
        run: |
          cd sourcemod
          git submodule update --init --recursive
        
      - name: download metamod
        uses: actions/checkout@v2
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          path: 'mmsource-1.12'
        
      - name: download ambuild
        uses: actions/checkout@v2
        with:
          repository: alliedmodders/ambuild
          path: 'ambuild'
        
      - name: install ambuild
        if: runner.os == 'Windows'
        run: |
          cd ambuild
          python setup.py install
        
      - name: install ambuild
        if: runner.os == 'Linux'
        run: |
          cd ambuild
          sudo python setup.py install
          
      - name: install linux packages
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y --no-install-recommends gcc-multilib g++-multilib clang
        
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x86

      - name: set cc and cxx variables
        if: runner.os == 'Linux'
        uses: allenevans/set-env@v2.0.0
        with:
          CC: clang
          CXX: clang++

      - name: configure ambuild
        run: |
          cd src
          mkdir build
          cd build
          python ../configure.py \
          --hl2sdk-root="$GITHUB_WORKSPACE" \
          --hl2sdk-manifest-path="$GITHUB_WORKSPACE/sourcemod/hl2sdk-manifests" \
          --sdks ${{ matrix.sdk }} \
          --sm-path="$GITHUB_WORKSPACE/sourcemod" \
          --mms-path="$GITHUB_WORKSPACE/mmsource-1.12" \
          --targets=x86 \
          --enable-optimize
              
      - name: build
        run: |
          cd src/build
          ambuild

      - name: upload extension artifact
        uses: actions/upload-artifact@master
        with:
          name: custom_fakelag_${{ matrix.os_short }}_${{ env.GITHUB_SHA_SHORT }}
          path: src/build/package/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          for folder in ${{ github.event.repository.name }}*; do
            if [ -d "$folder" ]; then
              echo "Processing folder: $folder"
              cd $folder
              tar -czf ../$folder.tar.gz -T <(\ls -1)
              cd ..
            fi
          done

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar.gz'
          tag: ${{ github.ref }}
          file_glob: true
